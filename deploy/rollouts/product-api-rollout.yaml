apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: product-api
spec:
  replicas: 3
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: success-rate-and-latency
      - setWeight: 30
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: success-rate-and-latency
      - setWeight: 100
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
      - name: product-api
        image: vigil/product-api:latest
        ports:
        - containerPort: 8080
