apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.fullname" . }}-detector
  labels:
    app: vigil-detector
spec:
  type: {{ .Values.detector.service.type }}
  ports:
    - port: {{ .Values.detector.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: vigil-detector
