apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vigil-cd/vigil.git
    targetRevision: HEAD
    path: deploy/rollouts
    directory:
      include: 'product-api-rollout.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
