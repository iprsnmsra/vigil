apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vigil-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vigil-cd/vigil.git
    targetRevision: HEAD
    path: deploy/helm/vigil
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vigil-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
