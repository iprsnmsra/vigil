version: '3.8'

services:
  product-api:
    build:
      context: ./product-api
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - FAILURE_MODE=
      - LOG_LEVEL=INFO

  order-api:
    build:
      context: ./order-api
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - FAILURE_MODE=
      - LOG_LEVEL=INFO
