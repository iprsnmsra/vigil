[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-cli"
version = "0.1.0"
description = "CLI for Vigil self-healing platform"
authors = [
    {name = "Vigil Team", email = "team@vigil.io"}
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0"
]

[project.scripts]
vigil = "vigil_cli.main:app"
