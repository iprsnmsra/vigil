name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How do you trigger this bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Vigil are you using?
    validations:
      required: true
